name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the previous run's answer irrelevant, so stop it. Never cancel
# main: its runs are the record of what is green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci`, not `install`: fails if package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      # Each check runs even if an earlier one failed, so one push shows every problem
      # instead of one at a time. The last step is the gate.
      - name: Type check
        id: types
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Format
        id: format
        run: npm run format:check
        continue-on-error: true

      - name: Unit tests
        id: unit
        run: npm test
        continue-on-error: true

      # The props are drawn by a script; the PNGs committed must be what it draws now.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/art/requirements.txt

      - name: Art
        id: art
        run: |
          pip install -r scripts/art/requirements.txt
          python3 scripts/art/props.py --check
        continue-on-error: true

      # The runner image ships shellcheck; the autostart script is the only shell we own.
      - name: Shell scripts
        id: shell
        run: shellcheck scripts/*.sh
        continue-on-error: true

      - name: Summary
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          SHELL_LINT: ${{ steps.shell.outcome }}
          ART: ${{ steps.art.outcome }}
        run: |
          mark() { [ "$1" = success ] && echo "✅ pass" || echo "❌ $1"; }
          {
            echo "## Checks"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Type check | $(mark "$TYPES") |"
            echo "| Lint | $(mark "$LINT") |"
            echo "| Format | $(mark "$FORMAT") |"
            echo "| Unit tests | $(mark "$UNIT") |"
            echo "| Shell scripts | $(mark "$SHELL_LINT") |"
            echo "| Art (props up to date) | $(mark "$ART") |"
          } >> "$GITHUB_STEP_SUMMARY"
          for s in "$TYPES" "$LINT" "$FORMAT" "$UNIT" "$SHELL_LINT" "$ART"; do
            [ "$s" = success ] || { echo "::error::a check failed; see the summary table"; exit 1; }
          done

  # The Herald (mod/): validate the plugin and the marketplace and run its tests in the
  # pinned CLI's own test kit (the type-check needs the API file a loaded mod gets, so it
  # runs locally, not here). None of these
  # call the model, so the CLI runs with no login.
  mod:
    name: Mod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_VERSION: 2.1.295
      DISABLE_AUTOUPDATER: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the pinned Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Mod checks
        run: npm run mod:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pushes screenshots to the ci-screenshots branch
      pull-requests: write # posts them on the PR
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Demo mode replays recorded fixtures frozen at a fixed second, so these tests have no
      # live backend, network or clock to flake on. That is why this job blocks merges from
      # the start, where movie-league's real-backend browser job had to earn it.
      - name: Run browser tests
        working-directory: web
        run: npx playwright test

      # Always, not only on failure: the point is to confirm a GREEN run rendered something.
      - uses: actions/upload-artifact@v7
        if: always()
        id: shots
        with:
          name: ui-screenshots
          path: web/e2e-screenshots/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      # !cancelled(), not always(): a run cut short by a newer push has only some of the
      # shots, and must not replace the comment the newer run is about to write.
      # The tests take every shot; the PR shows only those for the areas its files belong
      # to (web/e2e/shot-areas.ts), in every theme only when a theme file changed. The
      # "screenshots: all" label shows everything. The full set stays in the download above.
      - name: Choose the screenshots for this PR
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.shots.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs')
            const { execFileSync } = require('child_process')
            if (!fs.existsSync('web/e2e-screenshots')) return
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number, per_page: 100,
            })
            // A rename changes both paths.
            const changed = files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean))
            fs.writeFileSync('changed-files.txt', changed.join('\n'))
            const labels = context.payload.pull_request.labels.map((l) => l.name)
            const args = ['scripts/shot-select.ts', 'web/e2e-screenshots', 'web/e2e-screenshots-pr', 'changed-files.txt']
            if (labels.includes('screenshots: all')) args.push('--all')
            const out = execFileSync('node', args, {
              env: { ...process.env, SHA: context.payload.pull_request.head.sha.slice(0, 7) },
              encoding: 'utf8',
            })
            core.info(out)

      # GitHub strips data: URIs from images in summaries and PR comments, so the images
      # need a real URL. A branch on a public repo gives one through raw.githubusercontent,
      # with no auth. Skipped for fork PRs, whose token cannot push.
      - name: Publish the screenshots
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        id: publish
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          test -d web/e2e-screenshots-pr || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A worktree keeps the checkout under test untouched.
          git fetch origin ci-screenshots --depth=1 2>/dev/null \
            && git worktree add ../shots ci-screenshots \
            || git worktree add --orphan -b ci-screenshots ../shots

          # The sha is in the path because GitHub's image proxy (camo) caches by URL: a
          # stable path would keep showing the first version ever published.
          SHA=$(git rev-parse --short HEAD)
          DIR="pr-$PR/$SHA"
          rm -rf "../shots/pr-$PR"   # keep only the current commit's shots
          mkdir -p "../shots/$DIR"
          find web/e2e-screenshots-pr -name '*.png' -exec cp {} "../shots/$DIR/" \;

          cd ../shots
          git add -A
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
          else
            git commit -q -m "ci: screenshots for PR #$PR at $SHA"
            # PRs pushed together race for this branch. Each only writes its own pr-N
            # folder, so replaying our commit on the new tip is always clean. Cherry-pick
            # rather than rebase: the shallow fetch leaves no merge base to rebase from.
            for attempt in 1 2 3 4 5; do
              git push -q origin ci-screenshots && break
              [ "$attempt" = 5 ] && exit 1
              sleep $((attempt * 2))
              OURS=$(git rev-parse HEAD)
              git fetch -q origin ci-screenshots --depth=1
              git reset -q --hard FETCH_HEAD
              git cherry-pick "$OURS"
            done
          fi
          echo "base=https://raw.githubusercontent.com/${{ github.repository }}/ci-screenshots/$DIR" >> "$GITHUB_OUTPUT"

      - name: Put the screenshots in the run summary
        if: ${{ !cancelled() }}
        env:
          SHOTS_URL: ${{ steps.shots.outputs.artifact-url }}
          BASE: ${{ steps.publish.outputs.base }}
        run: |
          {
            echo "## UI screenshots"
            echo
            echo "Captured while the browser tests ran, so a green tick can be checked by eye."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$BASE" ]; then
            echo "_Published only for pull requests from this repo._" >> "$GITHUB_STEP_SUMMARY"
          elif [ -d web/e2e-screenshots-pr ]; then
            cat web/e2e-screenshots-pr/header.md >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            node scripts/shot-table.ts web/e2e-screenshots-pr "$BASE" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[Download at full resolution]($SHOTS_URL)" >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated in place: the chosen shots, each shot's themes side by
      # side (scripts/shot-table.ts). A new shoot() in a spec needs a place in
      # web/e2e/shot-areas.ts (a unit test says so), not an edit to this workflow.
      - name: Lay the screenshots out by theme
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.publish.outputs.base != '' }}
        env:
          BASE: ${{ steps.publish.outputs.base }}
        run: node scripts/shot-table.ts web/e2e-screenshots-pr "$BASE" > shot-table.md

      - name: Show them on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.publish.outputs.base != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const body = [
              '<!-- ui-screenshots -->',
              '### UI screenshots',
              '',
              fs.readFileSync('web/e2e-screenshots-pr/header.md', 'utf8'),
              '',
              fs.readFileSync('shot-table.md', 'utf8'),
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const mine = comments.find((c) => c.body.includes('<!-- ui-screenshots -->'))
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              })
            }
